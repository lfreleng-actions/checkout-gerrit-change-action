---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "checkout-gerrit-change"
description: "Checkout a Gerrit change, from its GitHub mirror or from Gerrit"

inputs:
  gerrit-refspec:
    description: "The Gerrit refspec for the change, eg: refs/changes/YY/NNYY/Z"
    required: true
  gerrit-project:
    description: "The project in Gerrit"
    required: true
  delay:
    description: "Delay in seconds to wait to make sure replication has finished. Default: 10s"
    required: false
    default: "10s"
  fetch-depth:
    description: >
      Number of commits to fetch. 0 indicates all history for all branches
      and tags. The default of 2 guarantees the checked-out change commit's
      parent is reachable, so parent-relative operations (e.g. git diff
      HEAD~1) work even when the change has already merged. Default 2
    required: false
    default: "2"
  repository:
    description: "Repository name with owner. For example actions/checkout"
    required: false
    default: ${{ github.repository }}
  ref:
    description: >
      The branch, tag or SHA to checkout. When checking out the repository that
      triggered a workflow, this defaults to the reference or SHA for that
      event. Otherwise, uses the default branch.
    required: false
    default: ${{ github.sha }}
  token:
    description: >
      Personal Access token (PAT) used to fetch the repository. The PAT is configured
      with the local git config, which enables your scripts to run authenticated git
      commands. The post-job step removes the PAT.

      We recommend using a service account with the least permissions necessary.
      Also, when generating a new PAT, select the least scopes necessary.
    default: ${{ github.token }}
  gerrit-url:
    description: |
      The base URL for the gerrit server. This is used if ref can't be found in
      the GitHub repository, or if the GitHub repository does not exist
    required: false
    default: ""
  on-unavailable:
    description: >
      What to do when the GitHub repository does not exist and Gerrit
      refuses anonymous access to the project, because the project is
      restricted or absent: `fail` the step, or `skip` the checkout and
      set the `checked-out` output to `false`. Network errors and a
      missing change always fail.

      Default: fail
    required: false
    default: "fail"
  submodules:
    description: >
      Whether to checkout submodules: `true` to checkout submodules or
      `recursive` to recursively checkout submodules. Submodules follow
      the Gerrit change, including ones it adds, retargets or removes.

      Default: false
    default: "false"

outputs:
  checked-out:
    description: >
      `true` once the change is checked out; `false` when
      `on-unavailable: skip` left the workspace empty
    value: ${{ steps.gerrit-checkout.outputs.checked-out || 'false' }}

runs:
  using: "composite"
  steps:
    # Runs before the checkout below, which is what fails when the
    # target is wrong: 'repository' defaults to github.repository, and
    # inside a reusable workflow that names the CALLER rather than the
    # project under review. A central .github repository acting for
    # another project then seeds the tree from itself, and the checkout
    # dies on a ref the caller does not carry. Warn first so the log
    # explains the failure that follows.
    - id: check-target
      shell: bash
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_GERRIT_PROJECT: ${{ inputs.gerrit-project }}
        CALLER_REPOSITORY: ${{ github.repository }}
      run: |
        # Warn when the checkout target contradicts the Gerrit project
        set -eu

        # Nothing to compare against, or the caller named a repository
        # deliberately, so say nothing.
        if [ -z "$INPUT_REPOSITORY" ] || [ -z "$INPUT_GERRIT_PROJECT" ] ||
           [ "$INPUT_REPOSITORY" != "$CALLER_REPOSITORY" ]
        then
          exit 0
        fi

        # Mirrors flatten the Gerrit path and sometimes gain an
        # 'archive-' prefix: aai/aai-common -> onap/aai-aai-common,
        # aaf/inno -> onap/archive-aaf-inno. Match on that shape.
        project=$(printf '%s' "$INPUT_GERRIT_PROJECT" \
          | tr '/' '-' | tr '[:upper:]' '[:lower:]')
        name=$(printf '%s' "${INPUT_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')

        case "$name" in
          "$project" | *"-$project") exit 0 ;;
        esac

        # Rebuild the expression hint from a variable so this run block
        # does not evaluate it as a workflow expression.
        d='$'
        fix="repository: ${d}{{ inputs.repository || github.repository }}"

        # Fold CR and LF into visible escapes before either value
        # reaches the log. A raw newline would otherwise start a fresh
        # log line, and the runner reads a line beginning '::' as a
        # workflow command, so escaping the annotation alone leaves the
        # console output as an injection path.
        show_repository=$INPUT_REPOSITORY
        show_repository=${show_repository//$'\r'/'\r'}
        show_repository=${show_repository//$'\n'/'\n'}
        show_project=$INPUT_GERRIT_PROJECT
        show_project=${show_project//$'\r'/'\r'}
        show_project=${show_project//$'\n'/'\n'}

        printf '%s\n' \
          'Gerrit checkout target mismatch' \
          '' \
          "  repository:     $show_repository (defaulted to the caller)" \
          "  gerrit-project: $show_project" \
          '' \
          "'github.repository' names the calling workflow, not the project" \
          'under review. Name the target on the step calling this action:' \
          '' \
          "    $fix"

        # Escape workflow-command metacharacters before emitting the
        # annotation. The folding above removes CR and LF, so this
        # mainly guards '%', but keep all three to match the error path
        # below. Escape '%' first to avoid double-escaping.
        annotation="Checking out '$show_repository' for Gerrit project"
        annotation="$annotation '$show_project'."
        annotation="$annotation Add '$fix' to the step calling this action."
        annotation=${annotation//'%'/'%25'}
        annotation=${annotation//$'\r'/'%0D'}
        annotation=${annotation//$'\n'/'%0A'}
        echo "::warning title=Gerrit checkout target mismatch::$annotation"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]
        then
          {
            echo '### Gerrit checkout target mismatch'
            echo
            echo "Checking out \`$show_repository\` (defaulted to the" \
              "calling workflow) for Gerrit project" \
              "\`$show_project\`."
            echo
            echo '`github.repository` names the calling workflow, not the'
            echo 'project under review. Name the target on the step calling'
            echo 'this action:'
            echo
            echo '```yaml'
            echo "  $fix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # Ask the GitHub API whether the mirror exists before checking it
    # out. Not every Gerrit project replicates to GitHub, and a missing
    # mirror otherwise surfaces only after actions/checkout has retried
    # it three times, as a generic fetch failure. Only a definite 404
    # sends the action to Gerrit; any other answer, an API outage
    # included, keeps the mirror path, whose own errors then explain
    # what went wrong. Without a gerrit-url there is nowhere else to
    # go, so the probe makes no request.
    - id: probe-mirror
      shell: bash
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_GERRIT_URL: ${{ inputs.gerrit-url }}
        INPUT_ON_UNAVAILABLE: ${{ inputs.on-unavailable }}
        API_URL: ${{ github.api_url }}
      run: |
        # Check whether the GitHub mirror exists
        set -euo pipefail

        # Validate on-unavailable here, where every run passes, rather
        # than in the fallback, so a typo fails before a mirror goes
        # missing rather than after. Trim and case-fold it the way
        # actions/checkout reads its inputs.
        on_unavailable=$(printf '%s' "$INPUT_ON_UNAVAILABLE" |
          tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        case "$on_unavailable" in
          fail | skip) ;;
          *)
            shown=${INPUT_ON_UNAVAILABLE//'%'/'%25'}
            shown=${shown//$'\r'/'%0D'}
            shown=${shown//$'\n'/'%0A'}
            echo "::error::Invalid on-unavailable input: '$shown' (expected fail or skip)"
            exit 1
            ;;
        esac
        echo "on-unavailable=$on_unavailable" >> "$GITHUB_OUTPUT"

        mirror=present
        # The name goes into a URL and the log, so accept only the
        # owner/name shape; actions/checkout rejects anything else. A
        # '.' or '..' segment would let curl resolve the path to some
        # other endpoint, whose 404 would then read as a missing mirror.
        if [ -n "$INPUT_GERRIT_URL" ] &&
           [[ "$INPUT_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] &&
           [[ ! "$INPUT_REPOSITORY" =~ (^|/)\.\.?(/|$) ]]
        then
          # The token reaches curl on stdin, as configuration, which
          # keeps it out of the process list. A private mirror the
          # token cannot see also answers 404, and Gerrit then serves
          # the change instead.
          status=$(
            if [ -n "$INPUT_TOKEN" ]
            then
              printf 'header = "Authorization: Bearer %s"\n' "$INPUT_TOKEN"
            fi |
              curl --config - --silent --output /dev/null \
                --write-out '%{http_code}' --retry 3 --max-time 30 \
                --header 'Accept: application/vnd.github+json' \
                -- "$API_URL/repos/$INPUT_REPOSITORY"
          ) || status=000
          if [ "$status" = 404 ]
          then
            mirror=absent
            echo "GitHub repository $INPUT_REPOSITORY not found;" \
              'checking the change out from Gerrit instead'
          fi
        fi
        echo "mirror=$mirror" >> "$GITHUB_OUTPUT"

    - id: delay-checkout
      if: steps.probe-mirror.outputs.mirror != 'absent'
      shell: bash
      env:
        INPUT_DELAY: ${{ inputs.delay }}
      run: sleep -- "$INPUT_DELAY"
    # The persisted checkout credentials are intentionally retained so the
    # 'git fetch origin' step below can reach the (possibly private)
    # repository; the token is configured into git by this checkout and the
    # action uploads no artifacts that could leak the credential.
    - if: steps.probe-mirror.outputs.mirror != 'absent'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        submodules: ${{ inputs.submodules }}
        persist-credentials: true # zizmor: ignore[artipacked]

    # With no mirror, Gerrit serves the change directly. Set up the
    # workspace with Gerrit as origin, in place of the clone
    # actions/checkout would have made, and fetch what that clone would
    # have held: every branch and tag for fetch-depth 0, otherwise the
    # branch 'ref' names, at the requested depth. gerrit-checkout below
    # then fetches the change itself and checks it out.
    #
    # First ask Gerrit whether it serves the change at all. A project
    # closed to anonymous reads, or absent, cannot be checked out from a
    # hosted runner, and on-unavailable decides whether that fails the
    # step or skips the checkout. A network failure, or a change the
    # project lacks, always fails: neither is a reason to pass a check.
    - id: gerrit-fallback
      if: steps.probe-mirror.outputs.mirror == 'absent'
      shell: bash --noprofile --norc {0}
      env:
        INPUT_GERRIT_REFSPEC: ${{ inputs.gerrit-refspec }}
        INPUT_GERRIT_URL: ${{ inputs.gerrit-url }}
        INPUT_GERRIT_PROJECT: ${{ inputs.gerrit-project }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
        ON_UNAVAILABLE: ${{ steps.probe-mirror.outputs.on-unavailable }}
      # yamllint disable rule:line-length
      run: |
        # Prepare a checkout from Gerrit in place of the missing mirror

        # Fold CR and LF into visible escapes, so a value reaching the
        # log cannot start a line the runner reads as a command.
        show()
        {
          value=$1
          value=${value//$'\r'/'\r'}
          printf '%s' "${value//$'\n'/'\n'}"
        }

        # As in gerrit-checkout: redact URL credentials, then escape the
        # annotation's workflow-command metacharacters, '%' first.
        report_error_and_exit()
        {
          message=$(printf '%s' "$1" | sed -E 's#://[^/@[:space:]]+@#://***@#g')
          printf '%s\n' "$message"
          annotation=${message//'%'/'%25'}
          annotation=${annotation//$'\r'/'%0D'}
          annotation=${annotation//$'\n'/'%0A'}
          echo "::error::$annotation"
          exit 1
        }

        project=$(show "$INPUT_GERRIT_PROJECT")
        refspec=$(show "$INPUT_GERRIT_REFSPEC")

        # Start from an empty workspace, as actions/checkout does when
        # the one it finds holds anything other than the repository
        # requested. actions/checkout also marks the workspace as a
        # safe directory, without which git refuses a repository owned
        # by another user, as in a container job; do the same, by the
        # physical path git compares against.
        workspace=$(pwd -P)
        if ! git config --global --get-all safe.directory 2> /dev/null |
             grep -Fqx -- "$workspace"
        then
          if ! git config --global --add safe.directory "$workspace"
          then
            report_error_and_exit "Unable to mark $(show "$workspace") as a safe directory"
          fi
        fi
        # Keep credentials embedded in gerrit-url out of .git/config,
        # where they would outlive this step for any later one to read:
        # store origin without them, and hand them back to git through
        # this step's environment as a rewrite of the plain URL. Set the
        # same way in gerrit-checkout, the other step talking to Gerrit.
        gerrit_base=${INPUT_GERRIT_URL%/}
        plain_base=$(printf '%s' "$gerrit_base" | sed -E 's#^([A-Za-z][A-Za-z0-9+.-]*://)[^/@]*@#\1#')
        if [ "$plain_base" != "$gerrit_base" ]
        then
          count=${GIT_CONFIG_COUNT:-0}
          export "GIT_CONFIG_KEY_$count=url.$gerrit_base/.insteadOf" \
            "GIT_CONFIG_VALUE_$count=$plain_base/" \
            "GIT_CONFIG_COUNT=$((count + 1))"
        fi
        if ! find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + ||
           ! git init -q ||
           ! git remote add origin "$plain_base/$INPUT_GERRIT_PROJECT"
        then
          report_error_and_exit "Unable to prepare a workspace for Gerrit project $project"
        fi

        # ls-remote takes the source side of the refspec as its pattern.
        # --exit-code returns 2 when the project lacks the ref; access
        # and transport errors return 128 and are told apart by message:
        # Gerrit answers 401 for a project closed to anonymous reads,
        # and 403 or 404 for one that is hidden or absent; git words a
        # 404 as "repository '<url>/' not found". LC_ALL=C keeps those
        # messages in English on a runner whose git is translated. With
        # prompts disabled, a project that wants credentials fails at
        # once rather than waiting on a terminal that is not there.
        pattern=${INPUT_GERRIT_REFSPEC#+}
        pattern=${pattern%%:*}
        error=$(LC_ALL=C GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code -- origin "$pattern" 2>&1 > /dev/null)
        case $? in
          0) available=true ;;
          2) report_error_and_exit "Gerrit project $project has no $refspec" ;;
          *)
            case "$error" in
              *'could not read Username'* | *'could not read Password'* | \
              *'Authentication failed'* | \
              *'returned error: 401'* | *'returned error: 403'* | \
              *'returned error: 404'* | *'does not appear to be a git repository'* | \
              *"repository '"*"' not found"*)
                available=false
                ;;
              *) report_error_and_exit "$error" ;;
            esac
            ;;
        esac

        # Fetch the base the mirror clone would have held, before the
        # change: actions/checkout fetches every branch and tag for
        # fetch-depth 0, and otherwise the branch 'ref' names, as
        # origin/<branch>. A 'ref' naming no branch (by default, the
        # caller's commit, which Gerrit does not hold) leaves only the
        # change, which gerrit-checkout fetches.
        if [ "$available" = true ]
        then
          fetch=()
          if [ "$INPUT_FETCH_DEPTH" = 0 ]
          then
            fetch=(--tags -- origin '+refs/heads/*:refs/remotes/origin/*')
          else
            case "$INPUT_REF" in
              refs/heads/?*)
                branch=${INPUT_REF#refs/heads/}
                fetch=("--depth=$INPUT_FETCH_DEPTH" -- origin
                  "+refs/heads/$branch:refs/remotes/origin/$branch")
                ;;
            esac
          fi
          if [ ${#fetch[@]} -gt 0 ] &&
             ! error=$(GIT_TERMINAL_PROMPT=0 git fetch -q --no-recurse-submodules "${fetch[@]}" 2>&1 > /dev/null)
          then
            report_error_and_exit "$error"
          fi
        fi

        if [ "$available" = false ]
        then
          message="Gerrit project $project has no GitHub mirror and refuses anonymous access, so $refspec cannot be checked out"
          if [ "$ON_UNAVAILABLE" != skip ]
          then
            report_error_and_exit "$message"
          fi
          # Leave the workspace empty, rather than holding a repository
          # with no commits that later steps might mistake for a tree.
          rm -rf .git
          echo "::notice title=Gerrit change not checked out::${message//'%'/'%25'}; skipped (on-unavailable: skip)"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]
          then
            {
              echo '### Gerrit change not checked out'
              echo
              echo "Gerrit project \`$project\` has no GitHub mirror and" \
                'refuses anonymous access, so the checkout was skipped' \
                "(\`on-unavailable: skip\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        echo "available=$available" >> "$GITHUB_OUTPUT"

    - id: gerrit-checkout
      if: steps.gerrit-fallback.outputs.available != 'false'
      shell: bash --noprofile --norc {0}
      env:
        INPUT_GERRIT_REFSPEC: ${{ inputs.gerrit-refspec }}
        INPUT_GERRIT_URL: ${{ inputs.gerrit-url }}
        INPUT_GERRIT_PROJECT: ${{ inputs.gerrit-project }}
        INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
        INPUT_SUBMODULES: ${{ inputs.submodules }}
        INPUT_TOKEN: ${{ inputs.token }}
        FALLBACK: ${{ steps.gerrit-fallback.outputs.available }}
        SERVER_URL: ${{ github.server_url }}
      # yamllint disable rule:line-length
      run: |
        # On the Gerrit fallback actions/checkout never ran, so none of
        # what it gives submodules hosted on GitHub is in place: the
        # token, as an HTTP header scoped to the server, and a rewrite
        # of SSH URLs to HTTPS, so a runner with no SSH key can clone
        # them. Supply both through the environment, to this step
        # alone: they never reach .git/config, so nothing outlives the
        # step for a later one to find, and Gerrit never sees the
        # token. git keeps these variables for the submodule commands
        # it runs. Set before xtrace starts, so the trace omits them.
        #
        # gerrit-fallback stored origin without any credentials
        # gerrit-url embeds; hand them back the way it did, as a
        # rewrite of the plain URL, for the fetch below.
        if [ "$FALLBACK" = true ]
        then
          count=${GIT_CONFIG_COUNT:-0}
          add_config()
          {
            export "GIT_CONFIG_KEY_$count=$1" "GIT_CONFIG_VALUE_$count=$2"
            count=$((count + 1))
          }
          gerrit_base=${INPUT_GERRIT_URL%/}
          plain_base=$(printf '%s' "$gerrit_base" | sed -E 's#^([A-Za-z][A-Za-z0-9+.-]*://)[^/@]*@#\1#')
          if [ "$plain_base" != "$gerrit_base" ]
          then
            add_config "url.$gerrit_base/.insteadOf" "$plain_base/"
          fi
          if [ -n "$SERVER_URL" ]
          then
            server=${SERVER_URL%/}
            host=${server#*://}
            add_config "url.$server/.insteadOf" "git@$host:"
            add_config "url.$server/.insteadOf" "ssh://git@$host/"
            if [ -n "$INPUT_TOKEN" ]
            then
              basic=$(printf 'x-access-token:%s' "$INPUT_TOKEN" | base64 | tr -d '\n')
              echo "::add-mask::$basic"
              add_config "http.$server/.extraheader" "AUTHORIZATION: basic $basic"
            fi
          fi
          export GIT_CONFIG_COUNT=$count
        fi

        set -x

        report_error_and_exit()
        {
          default="fatal: couldn't find remote ref $INPUT_GERRIT_REFSPEC"
          message=${1:-$default}
          # Redact any embedded URL credentials (user:pass@host) before
          # logging so a gerrit-url carrying userinfo cannot leak via the
          # echoed message or the GitHub error annotation.
          message=$(printf '%s' "$message" | sed -E 's#://[^/@[:space:]]+@#://***@#g')
          printf '%s\n' "$message"
          # Escape workflow-command metacharacters (%, CR, LF) before
          # emitting the annotation so a multi-line or percent-containing
          # git error cannot break the annotation or inject additional
          # workflow commands. Escape '%' first to avoid double-escaping.
          annotation=${message//'%'/'%25'}
          annotation=${annotation//$'\r'/'%0D'}
          annotation=${annotation//$'\n'/'%0A'}
          echo "::error::$annotation"
          exit 1
        }

        fetch_from_gerrit()
        {
          if [ -z "$INPUT_GERRIT_URL" ]
          then
            report_error_and_exit "$1"
          fi

          # Disable xtrace around the fetch and its failure handling so a
          # URL/refspec (or the resulting error, which git may echo with
          # the full remote URL) carrying embedded credentials is not
          # exposed via the build log.
          set +x
          error=$(git fetch --no-recurse-submodules "${depth_args[@]}" -- "$INPUT_GERRIT_URL/$INPUT_GERRIT_PROJECT" "$INPUT_GERRIT_REFSPEC" 2>&1 > /dev/null)
          exit_code=$?
          if [ $exit_code -ne 0 ]
          then
            report_error_and_exit "$error"
          fi
          set -x
        }

        # Print '<recorded commit> <path>' for each populated submodule of
        # the repository in the current directory. foreach expands $sha1
        # and $sm_path itself, so they stay in single quotes here.
        populated_submodules()
        {
          # shellcheck disable=SC2016
          git submodule foreach -q 'printf "%s %s\n" "$sha1" "$sm_path"'
        }

        # Deinitialise each populated submodule that commit $1 does not
        # record as a submodule: one the change drops, or replaces with
        # tracked files. Checking $1 out over it would leave its working
        # tree behind, still holding code the change deleted, or abort on
        # a file the change tracks at the same path. It has to happen
        # before the checkout, while git still knows the path as a
        # submodule. 'deinit' keeps the repository in .git/modules, as it
        # always does, ready for a later change that restores it.
        deinit_dropped()
        (
          set -o pipefail
          populated_submodules |
            while IFS= read -r line
            do
              path=${line#* }
              entry=$(git --literal-pathspecs ls-tree "$1" -- "$path") || exit 1
              case "$entry" in
                '160000 '*) ;;
                *)
                  git --literal-pathspecs submodule deinit -f -q -- "$path" < /dev/null ||
                    exit 1
                  ;;
              esac
            done
        )

        # The same, one level down, for each populated submodule this
        # repository now records at a new commit. 'update' fetches that
        # commit and checks it out in one go, so fetch it here first the
        # way 'update' would: what the remote advertises, then the
        # commit by name.
        deinit_dropped_nested()
        (
          set -o pipefail
          populated_submodules |
            while IFS= read -r line
            do
              commit=${line%% *}
              (
                cd -- "${line#* }" || exit 1
                if [ "$(git rev-parse HEAD)" = "$commit" ]
                then
                  exit 0
                fi
                if ! git cat-file -e "$commit^{commit}" 2> /dev/null
                then
                  git fetch -q --no-recurse-submodules
                  git cat-file -e "$commit^{commit}" 2> /dev/null ||
                    git fetch -q --no-recurse-submodules origin "$commit" ||
                    exit 1
                fi
                deinit_dropped "$commit"
              ) < /dev/null || exit 1
            done
        )

        # Move the submodules of the repository in the current directory
        # to the commits it records. 'sync' carries a retargeted
        # .gitmodules URL into the config before anything fetches, and
        # '--init' populates a submodule the change adds.
        # fetch.recurseSubmodules=false keeps each level's fetch out of
        # the level below until that level has been synced.
        update_submodules()
        {
          git submodule sync &&
            { [ "$submodules" != recursive ] || deinit_dropped_nested; } &&
            git -c fetch.recurseSubmodules=false submodule update --init
        }

        # 'recursive' walks one level at a time rather than passing
        # --recursive to sync and update: a nested submodule's URL comes
        # from its parent's .gitmodules at the parent's NEW commit, which
        # only exists once the level above is updated. Each submodule is
        # updated before the walk descends into it.
        update_nested()
        (
          set -o pipefail
          populated_submodules |
            while IFS= read -r line
            do
              ( cd -- "${line#* }" && update_submodules && update_nested ) < /dev/null ||
                exit 1
            done
        )

        # A fetch into a shallow repository inherits the shallow
        # boundary, which can graft away the change commit's parent --
        # for example when the change has already merged and the branch
        # tip IS the change commit. Apply the requested fetch depth to
        # the refspec fetch so the parent stays reachable for consumers
        # that diff against HEAD~1. Guarded by --is-shallow-repository
        # so a full clone (fetch-depth: 0) is never silently truncated.
        # A repository with no commits yet, which is what the Gerrit
        # fallback prepares, is not shallow either, so it takes the
        # requested depth too, unless that depth asks for everything.
        depth_args=()
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ] ||
           { ! git rev-parse -q --verify HEAD > /dev/null &&
             [ "$INPUT_FETCH_DEPTH" != 0 ]; }
        then
          depth_args=("--depth=$INPUT_FETCH_DEPTH")
        fi

        # Leave submodules out of the superproject fetch. By default git
        # recurses into populated ones on demand, using the URLs the
        # branch tip configured, so a change that retargets a submodule
        # fails here asking the old remote for a commit only the new one
        # holds. The refresh below fetches them once 'sync' has run.
        #
        # Disable xtrace around the fetch and its failure handling so a
        # refspec (or the resulting error, which git may echo with the
        # full remote URL) carrying embedded credentials is not exposed
        # via the build log.
        set +x
        error=$(git fetch --no-recurse-submodules "${depth_args[@]}" -- origin "$INPUT_GERRIT_REFSPEC" 2>&1 > /dev/null)
        exit_code=$?
        if [ $exit_code -ne 0 ]
        then
          fetch_from_gerrit "$error"
        fi
        set -x

        # actions/checkout populated submodules for the branch tip; move
        # them to the commits the change records, and remove the ones it
        # drops. Trim and case-fold the input the way actions/checkout
        # does (core.getInput trims whitespace), so every value that
        # populated submodules there also refreshes them here. 'false'
        # leaves submodules alone.
        #
        # This shell runs without -e, so report failure explicitly rather
        # than pass having left the branch-tip content in place.
        submodules=$(printf '%s' "$INPUT_SUBMODULES" |
          tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        if [ "$submodules" = true ] || [ "$submodules" = recursive ]
        then
          if ! deinit_dropped FETCH_HEAD
          then
            report_error_and_exit "Unable to remove submodules dropped by $INPUT_GERRIT_REFSPEC"
          fi
        fi
        if ! git checkout FETCH_HEAD
        then
          report_error_and_exit "Unable to check out $INPUT_GERRIT_REFSPEC"
        fi

        if [ "$submodules" = true ] || [ "$submodules" = recursive ]
        then
          if ! update_submodules
          then
            report_error_and_exit "Unable to update submodules for $INPUT_GERRIT_REFSPEC"
          fi
        fi
        if [ "$submodules" = recursive ]
        then
          if ! update_nested
          then
            report_error_and_exit "Unable to update nested submodules for $INPUT_GERRIT_REFSPEC"
          fi
        fi
        echo "checked-out=true" >> "$GITHUB_OUTPUT"
