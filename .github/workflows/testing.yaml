# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ### Submodules follow the change under review ###
  test-submodule-refresh:
    name: 'Test Submodule Refresh'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout action'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the gerrit-checkout step, as action.yaml defines it, against
      # local repositories, so it needs neither network access nor
      # credentials, and runs on pull requests from forks. The suites
      # carry no executable bit, which the code monkey bot cannot set or
      # keep when it edits a file, so they run through bash.
      - name: 'Check submodules follow the Gerrit change'
        shell: bash
        run: bash tests/submodule-refresh.sh

      # Runs the probe-mirror and gerrit-checkout steps against a stub
      # server on the loopback interface and local repositories, so it
      # too needs neither egress nor credentials.
      - name: 'Check the checkout falls back to Gerrit'
        shell: bash
        run: bash tests/gerrit-fallback.sh
